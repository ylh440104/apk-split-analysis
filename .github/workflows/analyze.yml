name: apk-analyze

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "report/**"
      - "app_src.zip"
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      JAVA_OPTS: -Xmx6g
      EXPECT_MD5: 897733a72eb3308b49b553704c5c3610
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble APK
        run: |
          set -eu
          cat apk_parts/apk.part.* > app.apk
          ls -l app.apk
          echo "$EXPECT_MD5  app.apk" | md5sum -c -

      - name: Setup tools
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip >/dev/null
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          ls -l jadx/bin/jadx apktool.jar

      - name: jadx decompile
        run: |
          ./jadx/bin/jadx --deobf --show-bad-code -j 4 -d out_jadx app.apk || true
          du -sh out_jadx

      - name: apktool decode
        run: |
          java -Xmx4g -jar apktool.jar d -f app.apk -o out_apktool || true
          du -sh out_apktool

      - name: Keyword scan
        run: |
          mkdir -p report
          python3 tools/scan.py out_jadx out_apktool | tee report/scan_stdout.txt

      - name: Pack artifacts
        if: always()
        run: |
          mkdir -p report bundle
          if [ -d out_jadx/sources ]; then
            for d in com/superior com/zy com/cl android/app/csdk; do
              if [ -d "out_jadx/sources/$d" ]; then mkdir -p "bundle/jadx/$d"; cp -r "out_jadx/sources/$d/." "bundle/jadx/$d/"; fi
            done
          fi
          if [ -d out_apktool ]; then
            mkdir -p bundle/apk
            cp -f out_apktool/AndroidManifest.xml bundle/apk/ 2>/dev/null || true
            for d in res/xml res/values assets; do
              if [ -e "out_apktool/$d" ]; then mkdir -p "bundle/apk/$d"; cp -r "out_apktool/$d/." "bundle/apk/$d/"; fi
            done
          fi
          du -sh bundle
          ( cd bundle && zip -qr -1 ../app_src.zip . )
          ls -l app_src.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-code
          path: app_code.zip
          retention-days: 30

      - name: Commit report back to repo
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f report app_src.zip || true
          git commit -m "ci: analysis report run ${GITHUB_RUN_ID} [skip ci]" || echo no-changes
          for i in 1 2 3; do git push origin HEAD:main && break; sleep 5; done || echo push-failed

      - name: Dump key hits
        if: always()
        run: |
          for f in summary fastboot adb_usb developer settings_write pm_disable shell_exec device_admin kiosk_lock root_check; do
            echo "########## $f ##########"
            head -80 "report/hits_$f.txt" 2>/dev/null || head -80 "report/$f.txt" 2>/dev/null || true
          done

      - name: Summary
        if: always()
        run: cat report/summary.txt >> $GITHUB_STEP_SUMMARY || true
