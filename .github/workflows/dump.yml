name: dump-csdk
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble + apktool (full smali)
        run: |
          cat apk_parts/apk.part.* > app.apk
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -Xmx5g -jar apktool.jar d -f app.apk -o out
          echo '--- csdk classes:'
          find out -path '*android/app/csdk*' -name '*.smali' | head -40
          mkdir -p dump
          find out -path '*android/app/csdk*' -name '*.smali' -exec cp {} dump/ \;
          echo '--- dump:'
          ls -l dump | head -60
      - name: Commit dump
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add -f dump || true
          git commit -m "ci: csdk dump [skip ci]" || echo no-changes
          for i in 1 2 3; do git push origin HEAD:main && break; sleep 5; done || echo push-failed
